{% extends 'soccerApp/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 glass-card p-5">
        <h3 class="mb-4 text-center">Add New Player</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control bg-dark text-white border-secondary">
            </div>
            <div class="mb-3">
                <label class="form-label">Position</label>
                <select name="position" class="form-select bg-dark text-white border-secondary">
                    <option>Goalkeeper</option>
                    <option>Defender</option>
                    <option>Midfielder</option>
                    <option>Forward</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Jersey Number</label>
                <input type="number" name="number" class="form-control bg-dark text-white border-secondary">
            </div>
            <button type="submit" class="btn btn-accent w-100 mt-3">Register Player</button>
        </form>
    </div>
</div>
{% endblock %}
