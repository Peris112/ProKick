{% extends 'soccerApp/base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">Match Schedule</h2>
<div class="glass-card overflow-hidden">
    <table class="table table-dark table-hover mb-0">
        <thead class="table-light text-dark">
            <tr>
                <th>Date/Time</th>
                <th>Home Team</th>
                <th>vs</th>
                <th>Away Team</th>
                <th>Venue</th>
            </tr>
        </thead>
        <tbody>
            {% for match in matches %}
            <tr>
                <td>{{ match.date|date:"M d, H:i" }}</td>
                <td class="fw-bold">{{ match.team_a }}</td>
                <td class="text-success">VS</td>
                <td class="fw-bold">{{ match.team_b }}</td>
                <td>{{ match.venue }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
